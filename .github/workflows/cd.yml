name: Backend CD

on:
  push:
    branches:
      - main

# Выкатка идёт на один боевой сервер: параллельные прогоны дерутся за
# docker compose и падают на «removal of container ... is already in progress».
concurrency:
  group: backend-cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  cd:
    name: Build Test Security Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # По умолчанию ssh-action обрывает команду через 10 минут. 13.10.2026 загрузка
          # образа с GHCR на сервер шла дольше, выкатка упала, а API остался на старой сборке.
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # Тянем и перезапускаем только API. Раньше здесь стояли `docker compose pull`
            # и `up -d` без имени сервиса: заодно тянулись образы сайта, лэнда и postgres,
            # а контейнеры соседей пересоздавались. `set -e` роняет выкатку при сбое загрузки,
            # чтобы шаг не рапортовал успех со старой сборкой.
            docker compose pull api
            docker compose up -d --no-deps api
